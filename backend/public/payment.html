<!doctype html>
<html lang="en" class="bg-gray-50">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout Payment - U-Mall</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Outfit", sans-serif;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      /* Apply English Font to SweetAlert */
      .swal2-popup,
      .swal2-title,
      .swal2-html-container,
      .swal2-confirm,
      .swal2-cancel {
        font-family: "Outfit", sans-serif !important;
      }
    </style>
  </head>
  <body class="text-gray-800 antialiased flex flex-col min-h-screen">
    <!-- ================= HEADER ================= -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
      <div
        class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between"
      >
        <a
          href="cart.html"
          class="flex items-center space-x-2 text-gray-600 hover:text-blue-600 transition-colors"
        >
          <i class="fas fa-arrow-left text-lg"></i>
          <span class="font-bold">Go Back</span>
        </a>
        <div class="text-lg font-bold text-gray-700">Checkout Payment</div>
        <div class="w-20"></div>
      </div>
    </header>

    <main class="flex-grow max-w-5xl mx-auto px-4 py-8 w-full">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <!-- ================= LEFT: PAYMENT METHODS ================= -->
        <div
          class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 h-fit"
        >
          <h2 class="text-xl font-bold text-gray-800 mb-6 flex items-center">
            <i class="fas fa-wallet text-blue-600 mr-3"></i>
            Select Payment Method
          </h2>

          <div class="flex space-x-2 mb-6 bg-gray-100 p-1 rounded-xl">
            <button
              id="tab-qr"
              onclick="switchTab('qr')"
              class="flex-1 py-2.5 rounded-lg font-medium text-sm transition-all bg-white shadow text-blue-600"
            >
              <i class="fas fa-qrcode mr-2"></i> U-Pay QR
            </button>
            <button
              id="tab-card"
              onclick="switchTab('card')"
              class="flex-1 py-2.5 rounded-lg font-medium text-sm transition-all text-gray-500 hover:text-gray-700"
            >
              <i class="fas fa-credit-card mr-2"></i> Credit Card
            </button>
          </div>

          <!-- U-Pay QR Section -->
          <div id="qr-section" class="text-center">
            <div
              class="inline-block p-4 border-2 border-dashed border-blue-200 rounded-2xl bg-blue-50 mb-4 relative min-h-[200px] flex items-center justify-center w-full max-w-[250px] mx-auto"
            >
              <img
                id="qr-img"
                src=""
                alt="U-Pay QR"
                class="w-48 h-48 md:w-56 md:h-56 object-cover rounded-xl hidden"
              />
              <div
                id="qr-loading"
                class="absolute inset-0 bg-white/80 flex flex-col items-center justify-center rounded-xl"
              >
                <i
                  class="fas fa-spinner fa-spin text-3xl text-blue-600 mb-2"
                ></i>
                <span
                  class="text-xs text-blue-600 font-bold"
                  id="qr-instruction-small"
                  >Preparing...</span
                >
              </div>
            </div>

            <p class="text-sm text-gray-500 mb-6" id="qr-instruction">
              Generating Invoice...
            </p>

            <button
              id="btn-deeplink"
              onclick="openUPayBank()"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-md transition-all flex items-center justify-center gap-2 pointer-events-none opacity-50"
            >
              <i class="fas fa-external-link-alt text-lg"></i> Proceed to U-Pay
              App
            </button>
          </div>

          <!-- Credit Card Section -->
          <div id="card-section" class="hidden">
            <div class="space-y-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1"
                  >Card Number</label
                >
                <input
                  type="text"
                  id="card-num"
                  placeholder="0000 0000 0000 0000"
                  maxlength="19"
                  class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all"
                />
              </div>
              <div class="flex gap-4">
                <div class="flex-1">
                  <label class="block text-sm font-medium text-gray-700 mb-1"
                    >Expiry Date</label
                  >
                  <input
                    type="text"
                    id="card-expiry"
                    placeholder="MM/YY"
                    maxlength="5"
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all"
                  />
                </div>
                <div class="flex-1">
                  <label class="block text-sm font-medium text-gray-700 mb-1"
                    >CVV</label
                  >
                  <input
                    type="password"
                    id="card-cvv"
                    placeholder="123"
                    maxlength="3"
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all"
                  />
                </div>
              </div>
              <button
                onclick="submitCardPayment()"
                class="w-full mt-4 bg-gray-800 hover:bg-black text-white font-bold py-3.5 rounded-xl shadow-md transition-all flex items-center justify-center gap-2"
              >
                <i class="fas fa-lock text-sm"></i> Confirm Payment
              </button>
            </div>
          </div>
        </div>

        <!-- ================= RIGHT: ORDER SUMMARY ================= -->
        <div
          class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 h-fit flex flex-col"
        >
          <div
            class="flex justify-between items-center mb-4 pb-4 border-b border-gray-100"
          >
            <h2 class="text-xl font-bold text-gray-800">Order Summary</h2>
            <a
              href="cart.html"
              class="text-sm font-medium text-blue-600 hover:underline"
            >
              <i class="fas fa-edit mr-1"></i> Edit
            </a>
          </div>

          <div
            class="text-sm font-normal text-gray-500 mb-3"
            id="display-order-id"
          >
            Loading...
          </div>

          <div
            id="order-items"
            class="flex-1 overflow-y-auto pr-2 space-y-3 mb-6 no-scrollbar max-h-[40vh]"
          >
            <!-- JS will render items here -->
          </div>

          <div class="border-t border-gray-100 pt-4 space-y-2">
            <div class="flex justify-between text-gray-600">
              <span>Subtotal</span><span id="sub-total">$0.00</span>
            </div>
            <div class="flex justify-between text-gray-600">
              <span>Shipping Fee</span><span id="shipping-fee">$1.50</span>
            </div>
            <div class="flex justify-between items-end pt-2">
              <span class="text-lg font-bold text-gray-800">Total Amount</span>
              <span id="total-amount" class="text-2xl font-bold text-blue-600"
                >$0.00</span
              >
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- ================= JAVASCRIPT LOGIC ================= -->
    <script>
      const API_ORDER_CREATE = "/api/orders/create";
      const API_UPAY_QR = "/api/payment/create-qr";
      const API_ORDER_STATUS = "/api/payment/orders/status";
      const API_GET_PRODUCTS = "/api/public/products"; // Corrected to match public product route

      let currentOrderId = "ORD-" + Math.floor(100000 + Math.random() * 900000);
      let currentTotal = 0;
      let cartItems = [];
      let uPayWebLink = "";
      let pollingInterval;

      let currentBuyerId = null;
      let currentPhone = "Not Set";
      let currentAddress = "Not Set";

      // Extracts valid ID to prevent [object Object] errors in Database
      function extractId(data) {
        if (!data) return null;
        if (typeof data === "string") return data;
        if (typeof data === "object") return data._id || data.id || null;
        return null;
      }

      document.addEventListener("DOMContentLoaded", async () => {
        const token = localStorage.getItem("token");
        if (token) {
          try {
            const base64Url = token.split(".")[1];
            const base64 = base64Url.replace(/-/g, "+").replace(/_/g, "/");
            const jsonPayload = decodeURIComponent(
              window
                .atob(base64)
                .split("")
                .map(
                  (c) => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2),
                )
                .join(""),
            );
            currentBuyerId = JSON.parse(jsonPayload).id;
          } catch (e) {
            console.error("Token Decode Error");
          }
        }

        const savedUser = localStorage.getItem("user");
        if (savedUser) {
          try {
            const parsedUser = JSON.parse(savedUser);
            if (parsedUser.phone && parsedUser.phone.trim() !== "")
              currentPhone = parsedUser.phone;
            if (parsedUser.address && parsedUser.address.trim() !== "")
              currentAddress = parsedUser.address;
          } catch (e) {}
        }

        const savedCart = localStorage.getItem("umall_cart");
        if (!savedCart || JSON.parse(savedCart).length === 0) {
          window.location.href = "cart.html";
          return;
        }

        cartItems = JSON.parse(savedCart);
        document.getElementById("display-order-id").innerText =
          "Order ID: " + currentOrderId;

        // Fetch real images and prices from DB
        try {
          const prodRes = await fetch(API_GET_PRODUCTS);
          const prodData = await prodRes.json();

          if (prodData.success && prodData.products) {
            cartItems = cartItems.map((item) => {
              const realProduct = prodData.products.find(
                (p) => p._id === item.id || p._id === item.productId,
              );
              if (realProduct) {
                return {
                  ...item,
                  image:
                    realProduct.imageUrl ||
                    realProduct.image ||
                    item.image ||
                    item.imageUrl,
                  price: realProduct.price,
                  storeId: extractId(
                    realProduct.store || item.storeId || item.store,
                  ),
                  productId: extractId(
                    realProduct._id || item.productId || item.id,
                  ),
                };
              }
              return item;
            });
          }
        } catch (e) {
          console.error("Database connection failed for images", e);
        }

        renderOrderList();
        startPaymentProcess();

        // Card Formatting Logic
        const cardNum = document.getElementById("card-num");
        cardNum.addEventListener("input", function (e) {
          let val = e.target.value.replace(/[^\d]/g, "");
          e.target.value = val.replace(/(.{4})/g, "$1 ").trim();
        });
      });

      function renderOrderList() {
        const itemsContainer = document.getElementById("order-items");
        let subTotal = 0;

        itemsContainer.innerHTML = cartItems
          .map((item) => {
            const itemQty = item.qty || item.quantity || 1;
            subTotal += item.price * itemQty;
            const imgSrc =
              item.image || item.imageUrl || "https://via.placeholder.com/80";

            return `
            <div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl border border-gray-100">
                <div class="flex items-center flex-1 gap-3 overflow-hidden">
                    <img src="${imgSrc}" onerror="this.src='https://via.placeholder.com/80';" class="w-12 h-12 rounded-lg object-cover border border-gray-200" />
                    <div class="flex-1 min-w-0">
                        <div class="font-bold text-gray-800 text-sm truncate">${item.name}</div>
                        <div class="text-xs text-gray-500 mt-0.5">Qty: ${itemQty}</div>
                    </div>
                </div>
                <div class="font-bold text-blue-600 text-sm pl-2">$${(item.price * itemQty).toFixed(2)}</div>
            </div>`;
          })
          .join("");

        document.getElementById("sub-total").innerText =
          "$" + subTotal.toFixed(2);
        currentTotal = subTotal + 1.5;
        document.getElementById("total-amount").innerText =
          "$" + currentTotal.toFixed(2);
      }

      async function startPaymentProcess() {
        try {
          document.getElementById("qr-instruction").innerText =
            "Generating Invoice...";

          const ordersByStore = {};
          cartItems.forEach((item) => {
            const storeId =
              extractId(item.storeId || item.store) || "unknown_store";
            if (!ordersByStore[storeId]) ordersByStore[storeId] = [];
            ordersByStore[storeId].push(item);
          });

          const totalStoresCount = Object.keys(ordersByStore).length;

          // Save separate orders to database
          const orderPromises = Object.keys(ordersByStore).map(
            (storeId, index) => {
              const storeItems = ordersByStore[storeId];
              const storeSubTotal = storeItems.reduce(
                (sum, i) => sum + i.price * (i.qty || i.quantity || 1),
                0,
              );
              const uniqueOrderId =
                totalStoresCount > 1
                  ? `${currentOrderId}-${index + 1}`
                  : currentOrderId;

              const orderPayload = {
                orderId: uniqueOrderId,
                totalAmount: storeSubTotal,
                status: "unpaid",
                items: storeItems.map((i) => {
                  const pId = extractId(i.productId || i.id || i.product);
                  return {
                    product: pId,
                    productId: pId,
                    name: i.name || "Unknown Product",
                    price: Number(i.price) || 0,
                    quantity: Number(i.qty || i.quantity || 1),
                    qty: Number(i.qty || i.quantity || 1),
                    image: i.image || "https://via.placeholder.com/80",
                    variant: i.variant || "",
                  };
                }),
                buyer: extractId(currentBuyerId),
                shippingAddress: currentAddress,
                phone: currentPhone,
                store: storeId && storeId !== "unknown_store" ? storeId : null,
              };

              return fetch(API_ORDER_CREATE, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(orderPayload),
              }).then(async (res) => {
                if (!res.ok) {
                  const err = await res.json();
                  throw new Error(
                    err.message || "Failed to save order to Database.",
                  );
                }
                return res.json();
              });
            },
          );

          await Promise.all(orderPromises);

          document.getElementById("qr-instruction").innerText =
            "Requesting QR from U-Pay...";

          const qrResponse = await fetch(API_UPAY_QR, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              orderId: currentOrderId,
              amount: currentTotal,
            }),
          });
          const qrData = await qrResponse.json();

          if (qrData.success) {
            document.getElementById("qr-loading").classList.add("hidden");
            document.getElementById("qr-instruction").innerHTML =
              `Scan QR Code to Pay`;

            uPayWebLink = qrData.deepLink || qrData.qrData;
            const qrImg = document.getElementById("qr-img");
            qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(uPayWebLink)}&color=2563EB`;
            qrImg.classList.remove("hidden");

            document
              .getElementById("btn-deeplink")
              .classList.remove("pointer-events-none", "opacity-50");
            startPolling();
          } else {
            throw new Error(qrData.message || "Failed to generate QR");
          }
        } catch (error) {
          console.error("Error:", error);
          document.getElementById("qr-loading").classList.add("hidden");
          document.getElementById("qr-instruction").innerHTML =
            `<span class='text-red-500 font-bold text-sm'>Error: ${error.message}</span>`;
          Swal.fire("Payment Failed", error.message, "error");
        }
      }

      function startPolling() {
        if (pollingInterval) clearInterval(pollingInterval);
        pollingInterval = setInterval(async () => {
          try {
            const res = await fetch(`${API_ORDER_STATUS}/${currentOrderId}`);
            const data = await res.json();

            if (data.success) {
              if (data.status === "PAID" || data.status === "SUCCESS") {
                clearInterval(pollingInterval);
                Swal.fire({
                  icon: "success",
                  title: "Success!",
                  text: "Payment Received",
                  timer: 2000,
                  showConfirmButton: false,
                }).then(() => {
                  localStorage.setItem("umall_cart", "[]");
                  window.location.href = "my-orders.html";
                });
              } else if (
                data.status === "FAILED" ||
                data.status === "REJECTED"
              ) {
                clearInterval(pollingInterval);
                Swal.fire({
                  icon: "error",
                  title: "Transaction Failed",
                  text: "The payment was rejected!",
                  confirmButtonColor: "#ef4444",
                }).then(() => {
                  window.location.reload();
                });
              }
            }
          } catch (e) {}
        }, 3000);
      }

      function openUPayBank() {
        if (uPayWebLink) window.open(uPayWebLink, "_blank");
      }

      function switchTab(type) {
        document
          .getElementById("qr-section")
          .classList.toggle("hidden", type !== "qr");
        document
          .getElementById("card-section")
          .classList.toggle("hidden", type !== "card");

        document.getElementById("tab-qr").className =
          type === "qr"
            ? "flex-1 py-2.5 rounded-lg font-medium text-sm transition-all bg-white shadow text-blue-600"
            : "flex-1 py-2.5 rounded-lg font-medium text-sm transition-all text-gray-500 hover:text-gray-700";
        document.getElementById("tab-card").className =
          type === "card"
            ? "flex-1 py-2.5 rounded-lg font-medium text-sm transition-all bg-white shadow text-blue-600"
            : "flex-1 py-2.5 rounded-lg font-medium text-sm transition-all text-gray-500 hover:text-gray-700";
      }

      // Card Formatting Logic
      document.addEventListener("DOMContentLoaded", () => {
        const cardExpiryInput = document.getElementById("card-expiry");
        const cardCvvInput = document.getElementById("card-cvv");

        cardExpiryInput.addEventListener("input", function (e) {
          let rawValue = this.value.replace(/\D/g, "");
          if (rawValue.length > 4) rawValue = rawValue.slice(0, 4);
          if (rawValue.length >= 3)
            this.value = rawValue.substring(0, 2) + "/" + rawValue.substring(2);
          else this.value = rawValue;
          if (rawValue.length === 4) cardCvvInput.focus();
        });

        cardCvvInput.addEventListener("input", function (e) {
          let rawValue = this.value.replace(/\D/g, "");
          if (rawValue.length > 3) rawValue = rawValue.slice(0, 3);
          this.value = rawValue;
        });
      });

      async function submitCardPayment() {
        const cardNum = document
          .getElementById("card-num")
          .value.replace(/\s+/g, "");
        const expiry = document.getElementById("card-expiry").value;
        const cvv = document.getElementById("card-cvv").value;

        if (!cardNum || !expiry || !cvv)
          return Swal.fire(
            "Required",
            "Please fill in all card details!",
            "warning",
          );

        Swal.fire({
          title: "Connecting to U-Pay...",
          allowOutsideClick: false,
          didOpen: () => Swal.showLoading(),
        });

        try {
          const res = await fetch("/api/payment/process-card", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              orderId: currentOrderId,
              amount: currentTotal,
              cardNumber: cardNum,
              expiry: expiry,
              cvv: cvv,
            }),
          });
          const data = await res.json();
          if (data.success) {
            Swal.fire({
              title: "Check your U-Pay App",
              html: "Waiting for confirmation...<br><br><i class='fas fa-spinner fa-spin text-3xl text-blue-600 mt-4'></i>",
              showConfirmButton: false,
              allowOutsideClick: false,
            });
            startPolling();
          } else {
            Swal.fire("Failed", data.message, "error");
          }
        } catch (e) {
          Swal.fire("Failed", "Connection error", "error");
        }
      }
    </script>
  </body>
</html>
