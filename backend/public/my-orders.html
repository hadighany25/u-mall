<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Orders | U-Mall</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
      body {
        font-family: "Outfit", sans-serif;
        background-color: #f8fafc;
        color: #1e293b;
      }
      .swal2-popup,
      .swal2-title,
      .swal2-html-container,
      .swal2-confirm {
        font-family: "Outfit", sans-serif !important;
      }
      .tabs-container::-webkit-scrollbar {
        display: none;
      }
      .tabs-container {
        scrollbar-width: none;
      }
      .star-rating {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin: 20px 0;
        direction: rtl;
      }
      .star-rating input {
        display: none;
      }
      .star-rating label {
        font-size: 2rem;
        color: #cbd5e1;
        cursor: pointer;
        transition: 0.2s;
      }
      .star-rating label:hover,
      .star-rating label:hover ~ label,
      .star-rating input:checked ~ label {
        color: #f59e0b;
      }
      .loader-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.8);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 2000;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #e2e8f0;
        border-top: 4px solid #2563eb;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="antialiased flex flex-col min-h-screen">
    <div class="loader-overlay" id="loader"><div class="spinner"></div></div>

    <header class="bg-white shadow-sm sticky top-0 z-50">
      <div
        class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between"
      >
        <!-- 🌟 កន្លែងបង្ហាញ Logo ពី Database -->
        <a
          href="index.html"
          class="flex items-center space-x-3 flex-shrink-0 mr-2"
          id="main-logo-container"
        >
          <!-- Logo លំនាំដើម នឹងត្រូវជំនួសដោយកូដ JS បើមាន Logo ក្នុង DB -->
          <div
            class="flex items-center gap-2 bg-gradient-to-r from-blue-600 to-blue-700 text-white px-3 py-1.5 rounded-xl shadow-sm hover:opacity-95 transition"
          >
            <span
              class="w-8 h-8 rounded-lg bg-white/20 flex items-center justify-center font-black text-xl"
              >U</span
            >
            <span class="font-bold text-xl tracking-tight pr-1">Mall</span>
          </div>
        </a>

        <a
          href="index.html"
          class="text-sm font-medium text-gray-600 hover:text-blue-600 transition"
          ><i class="fas fa-home mr-1"></i> Home</a
        >
      </div>
    </header>

    <main class="flex-grow max-w-4xl mx-auto px-4 py-8 w-full">
      <h2 class="text-2xl font-bold text-gray-800 mb-6">My Orders</h2>

      <div class="tabs-container flex gap-3 overflow-x-auto pb-2 mb-6">
        <button
          class="tab-btn px-5 py-2 rounded-full border border-gray-200 bg-blue-600 text-white font-medium text-sm transition-all whitespace-nowrap"
          onclick="filterOrders('all', this)"
        >
          All Orders
        </button>
        <button
          class="tab-btn px-5 py-2 rounded-full border border-gray-200 bg-white text-gray-600 hover:border-blue-600 hover:text-blue-600 font-medium text-sm transition-all whitespace-nowrap"
          onclick="filterOrders('pending', this)"
        >
          Pending
        </button>
        <button
          class="tab-btn px-5 py-2 rounded-full border border-gray-200 bg-white text-gray-600 hover:border-blue-600 hover:text-blue-600 font-medium text-sm transition-all whitespace-nowrap"
          onclick="filterOrders('processing', this)"
        >
          Processing
        </button>
        <button
          class="tab-btn px-5 py-2 rounded-full border border-gray-200 bg-white text-gray-600 hover:border-blue-600 hover:text-blue-600 font-medium text-sm transition-all whitespace-nowrap"
          onclick="filterOrders('shipped', this)"
        >
          Shipped
        </button>
        <button
          class="tab-btn px-5 py-2 rounded-full border border-gray-200 bg-white text-gray-600 hover:border-blue-600 hover:text-blue-600 font-medium text-sm transition-all whitespace-nowrap"
          onclick="filterOrders('completed', this)"
        >
          Completed
        </button>
        <button
          class="tab-btn px-5 py-2 rounded-full border border-gray-200 bg-white text-gray-600 hover:border-blue-600 hover:text-blue-600 font-medium text-sm transition-all whitespace-nowrap"
          onclick="filterOrders('cancelled', this)"
        >
          Cancelled
        </button>
      </div>

      <div id="order-container" class="space-y-6"></div>
    </main>

    <!-- Review Modal -->
    <div
      id="review-modal"
      class="fixed inset-0 bg-black/50 hidden justify-center items-center z-[1000] backdrop-blur-sm"
    >
      <div
        class="bg-white w-full max-w-md rounded-2xl p-6 md:p-8 text-center m-4 shadow-xl transform transition-all"
      >
        <h3 class="text-xl font-bold text-blue-600 mb-2">
          Rate Store & Product
        </h3>
        <p class="text-gray-500 text-sm">
          Are you satisfied with this product?
        </p>
        <div class="star-rating">
          <input type="radio" id="star5" name="rating" value="5" /><label
            for="star5"
            class="fas fa-star"
          ></label>
          <input type="radio" id="star4" name="rating" value="4" /><label
            for="star4"
            class="fas fa-star"
          ></label>
          <input type="radio" id="star3" name="rating" value="3" /><label
            for="star3"
            class="fas fa-star"
          ></label>
          <input type="radio" id="star2" name="rating" value="2" /><label
            for="star2"
            class="fas fa-star"
          ></label>
          <input type="radio" id="star1" name="rating" value="1" /><label
            for="star1"
            class="fas fa-star"
          ></label>
        </div>
        <textarea
          id="review-text"
          rows="3"
          class="w-full p-3 border border-gray-200 rounded-xl outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-sm mb-6"
          placeholder="Share your experience... (Optional)"
        ></textarea>
        <div class="flex gap-3">
          <button
            class="flex-1 px-4 py-2.5 rounded-xl border border-gray-200 text-gray-600 font-bold hover:bg-gray-50 transition"
            onclick="closeReviewModal()"
          >
            Cancel
          </button>
          <button
            class="flex-1 px-4 py-2.5 rounded-xl bg-blue-600 text-white font-bold hover:bg-blue-700 shadow-md transition"
            onclick="submitReview()"
          >
            Submit Review
          </button>
        </div>
      </div>
    </div>

    <script>
      let currentOrderIdToReview = null;
      let allOrders = [];
      let currentFilterStatus = "all"; // 🌟 ចងចាំ Tab ដែលយើងកំពុងមើល ពេល Auto-refresh វាមិនលោតបាត់

      // 🌟 មុខងារទាញយក Logo ពី Database
      async function fetchSettings() {
        try {
          const res = await fetch("/api/settings");
          const data = await res.json();
          if (data.success && data.setting) {
            const s = data.setting;
            if (s.logoUrl && s.logoUrl.trim() !== "") {
              const cleanLogoHtml = `
                <div class="flex items-center gap-2 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 px-3 py-1.5 rounded-xl shadow-sm hover:scale-105 transition">
                  <img src="${s.logoUrl}" alt="U-Mall Logo" class="h-10 md:h-12 w-auto object-contain" />
                </div>`;
              document.getElementById("main-logo-container").innerHTML =
                cleanLogoHtml;
            }
          }
        } catch (error) {
          console.error("Error setting:", error);
        }
      }

      // 🌟 មុខងារទាញយកប្រវត្តិបញ្ជាទិញ (បន្ថែមប៉ារ៉ាម៉ែត្រ showLoader ដើម្បីការពារការភ្លឹបភ្លែតពេល Auto-refresh)
      async function fetchOrders(showLoader = true) {
        const loader = document.getElementById("loader");
        if (showLoader) loader.style.display = "flex";

        try {
          const token = localStorage.getItem("token");
          if (!token) {
            if (showLoader) {
              Swal.fire({
                icon: "warning",
                title: "Login Required",
                text: "Please log in first!",
              });
            }
            return;
          }

          let buyerId = null;
          try {
            const base64Url = token.split(".")[1];
            const base64 = base64Url.replace(/-/g, "+").replace(/_/g, "/");
            const jsonPayload = decodeURIComponent(
              window
                .atob(base64)
                .split("")
                .map(
                  (c) => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2),
                )
                .join(""),
            );
            buyerId = JSON.parse(jsonPayload).id;
          } catch (e) {
            console.error("Token Error");
          }

          const response = await fetch(
            `/api/orders/my-orders?buyerId=${buyerId}`,
            {
              method: "GET",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`,
              },
            },
          );

          const result = await response.json();
          if (result.success) {
            allOrders = result.data.filter(
              (order) => order.status !== "unpaid",
            );
            renderOrders(currentFilterStatus); // Render តែ Tab ដែលកំពុងបើក
          }
        } catch (error) {
          console.log(error);
        } finally {
          if (showLoader) loader.style.display = "none";
        }
      }

      const statusConfig = {
        pending: {
          text: "Pending",
          class: "bg-yellow-100 text-yellow-800 border border-yellow-200",
        },
        processing: {
          text: "Processing",
          class: "bg-blue-100 text-blue-800 border border-blue-200",
        },
        shipped: {
          text: "Shipped",
          class: "bg-orange-100 text-orange-800 border border-orange-200",
        },
        completed: {
          text: "Completed",
          class: "bg-green-100 text-green-800 border border-green-200",
        },
        cancelled: {
          text: "Cancelled",
          class: "bg-gray-200 text-gray-800 border border-gray-300",
        },
      };

      function getActionButtons(order) {
        let btns = "";
        const btnClassBase =
          "px-4 py-2 rounded-lg text-sm font-bold flex items-center justify-center gap-2 transition shadow-sm ";
        const btnOutline =
          btnClassBase +
          "bg-white border border-gray-200 text-gray-700 hover:bg-gray-50";
        const btnPrimary =
          btnClassBase + "bg-blue-600 text-white hover:bg-blue-700";

        if (order.status === "pending" || order.status === "processing") {
          btns += `<button class="${btnOutline}" onclick="contactSeller('${order.store?._id || ""}')"><i class="fas fa-comment-dots"></i> Contact Seller</button>`;
        } else if (order.status === "shipped") {
          btns += `<button class="${btnPrimary}" onclick="confirmOrder('${order._id}')"><i class="fas fa-check-circle"></i> Confirm Receipt</button>`;
        } else if (order.status === "completed") {
          if (!order.isReviewed) {
            btns += `<button class="${btnPrimary}" onclick="openReviewModal('${order._id}')"><i class="fas fa-star"></i> Rate Store</button>`;
          }
          btns += `<button class="${btnOutline}" onclick="reportOrder('${order._id}')"><i class="fas fa-undo"></i> Return / Refund</button>`;
        } else if (order.status === "cancelled") {
          btns += `<button class="${btnOutline}" onclick="buyAgain('${order._id}')"><i class="fas fa-redo"></i> Buy Again</button>`;
        }
        return btns;
      }

      function renderOrders(filter = "all") {
        const container = document.getElementById("order-container");
        const filteredOrders =
          filter === "all"
            ? allOrders
            : allOrders.filter((o) => o.status === filter);

        if (filteredOrders.length === 0) {
          container.innerHTML = `
            <div class="text-center py-20 text-gray-400">
                <i class="fas fa-box-open text-6xl mb-4 text-gray-300"></i>
                <h3 class="text-lg font-bold text-gray-600">No orders found</h3>
            </div>`;
          return;
        }

        const groupedOrders = {};
        filteredOrders.forEach((order) => {
          const baseId = (order.orderId || order._id)
            .split("-")
            .slice(0, 2)
            .join("-");
          if (!groupedOrders[baseId]) {
            groupedOrders[baseId] = {
              baseId: baseId,
              createdAt: order.createdAt,
              subOrders: [],
            };
          }
          groupedOrders[baseId].subOrders.push(order);
        });

        let html = "";
        Object.values(groupedOrders)
          .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))
          .forEach((group) => {
            let sessionTotalAmount = 0;
            let subOrdersHtml = "";

            group.subOrders.forEach((order) => {
              sessionTotalAmount += order.totalAmount;
              const statusInfo = statusConfig[order.status] || {
                text: order.status,
                class: "bg-gray-100 text-gray-800",
              };

              const itemsHtml = order.items
                .map(
                  (item) => `
                    <div class="flex items-center gap-4 py-3">
                        <img src="${item.image || "https://via.placeholder.com/80"}" class="w-16 h-16 rounded-lg object-cover border border-gray-100" alt="Product">
                        <div class="flex-1">
                            <div class="font-bold text-gray-800 text-sm md:text-base">${item.name}</div>
                            <div class="text-xs text-gray-500 mt-1">${item.variant || ""} | Qty: ${item.quantity || item.qty}</div>
                        </div>
                        <div class="font-bold text-blue-600">$${(item.price * (item.quantity || item.qty || 1)).toFixed(2)}</div>
                    </div>
                `,
                )
                .join("");

              subOrdersHtml += `
                    <div class="bg-white rounded-xl p-4 md:p-5 mb-4 border border-gray-100 shadow-sm hover:shadow-md transition">
                        <div class="flex justify-between items-center border-b border-gray-100 pb-3 mb-2">
                            <div class="font-bold text-gray-800 flex items-center gap-2 cursor-pointer hover:text-blue-600">
                                <i class="fas fa-store text-blue-500"></i> ${order.store?.storeName || "U-Mall Official"}
                            </div>
                            <div class="px-3 py-1 rounded-full text-xs font-bold ${statusInfo.class}">${statusInfo.text}</div>
                        </div>
                        <div class="divide-y divide-gray-50">${itemsHtml}</div>
                        <div class="flex flex-col md:flex-row justify-between items-center pt-4 mt-2 border-t border-gray-50 gap-4">
                            <div class="text-sm text-gray-500 font-medium">Order Subtotal: <span class="text-lg text-gray-800 font-bold ml-1">$${order.totalAmount.toFixed(2)}</span></div>
                            <div class="flex w-full md:w-auto gap-2">${getActionButtons(order)}</div>
                        </div>
                    </div>
                `;
            });

            const dateStr = new Date(group.createdAt).toLocaleString("en-US", {
              year: "numeric",
              month: "short",
              day: "numeric",
              hour: "2-digit",
              minute: "2-digit",
            });
            html += `
                <div class="bg-blue-50/50 rounded-2xl border border-blue-100 mb-8 overflow-hidden">
                    <div class="bg-blue-100/50 px-5 py-3 flex flex-col sm:flex-row justify-between sm:items-center border-b border-blue-100 gap-2">
                        <div class="flex items-center gap-3">
                            <span class="font-bold text-blue-900 text-sm"><i class="fas fa-receipt mr-1"></i> Order ID: ${group.baseId}</span>
                            <span class="text-xs text-blue-600 font-medium"><i class="far fa-clock"></i> ${dateStr}</span>
                        </div>
                        <div class="text-sm font-bold text-blue-900">Total Payment: <span class="text-lg ml-1">$${sessionTotalAmount.toFixed(2)}</span></div>
                    </div>
                    <div class="p-4 md:p-6 bg-transparent">${subOrdersHtml}</div>
                </div>
            `;
          });
        container.innerHTML = html;
      }

      function filterOrders(status, btnElement) {
        currentFilterStatus = status; // 🌟 ចងចាំ Tab ពេលចុច
        document.querySelectorAll(".tab-btn").forEach((t) => {
          t.classList.remove("bg-blue-600", "text-white");
          t.classList.add("bg-white", "text-gray-600");
        });
        btnElement.classList.remove("bg-white", "text-gray-600");
        btnElement.classList.add("bg-blue-600", "text-white");
        renderOrders(status);
      }

      function contactSeller(storeId) {
        Swal.fire({
          icon: "info",
          title: "Coming Soon",
          text: "Chat functionality will be available shortly!",
          confirmButtonColor: "#2563eb",
        });
      }
      function reportOrder(orderId) {
        Swal.fire({
          icon: "info",
          title: "Customer Support",
          text: "Please contact Admin at (012) 345-678 for returns.",
          confirmButtonColor: "#2563eb",
        });
      }
      function buyAgain(orderId) {
        Swal.fire({
          icon: "info",
          title: "Coming Soon",
          text: "Items will be added to your cart instantly.",
          confirmButtonColor: "#2563eb",
        });
      }
      function openReviewModal(orderId) {
        currentOrderIdToReview = orderId;
        document
          .querySelectorAll(".star-rating input")
          .forEach((r) => (r.checked = false));
        document.getElementById("review-text").value = "";
        document.getElementById("review-modal").style.display = "flex";
      }
      function closeReviewModal() {
        document.getElementById("review-modal").style.display = "none";
        currentOrderIdToReview = null;
      }

      async function submitReview() {
        const ratingEle = document.querySelector(
          'input[name="rating"]:checked',
        );
        if (!ratingEle) {
          return Swal.fire({
            icon: "warning",
            text: "Please select a star rating first!",
            confirmButtonColor: "#2563eb",
          });
        }

        document.getElementById("review-modal").style.display = "none";
        document.getElementById("loader").style.display = "flex";

        try {
          const response = await fetch(
            `/api/orders/${currentOrderIdToReview}/review`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${localStorage.getItem("token")}`,
              },
              body: JSON.stringify({
                rating: ratingEle.value,
                comment: document.getElementById("review-text").value,
              }),
            },
          );
          const data = await response.json();
          if (data.success) {
            Swal.fire({
              icon: "success",
              title: "Success!",
              text: "Thank you for your feedback.",
              confirmButtonColor: "#2563eb",
            });
            fetchOrders(false);
          } else {
            Swal.fire({ icon: "error", title: "Failed", text: data.message });
          }
        } catch (error) {
          Swal.fire({
            icon: "error",
            title: "System Error",
            text: "Cannot connect to server.",
          });
        } finally {
          document.getElementById("loader").style.display = "none";
        }
      }

      function confirmOrder(orderId) {
        Swal.fire({
          title: "Confirm Receipt?",
          text: "Have you received this order in good condition?",
          icon: "question",
          showCancelButton: true,
          confirmButtonColor: "#2563eb",
          cancelButtonColor: "#e2e8f0",
          confirmButtonText: "Yes, I got it",
          cancelButtonText: '<span style="color:#1e293b">Cancel</span>',
        }).then(async (result) => {
          if (result.isConfirmed) {
            document.getElementById("loader").style.display = "flex";
            try {
              const response = await fetch(`/api/orders/${orderId}/confirm`, {
                method: "PUT",
                headers: {
                  "Content-Type": "application/json",
                  Authorization: `Bearer ${localStorage.getItem("token")}`,
                },
              });
              const data = await response.json();
              if (data.success) {
                Swal.fire({
                  icon: "success",
                  title: "Thank You!",
                  text: "Order marked as completed.",
                  confirmButtonColor: "#2563eb",
                });
                fetchOrders(false);
              } else {
                Swal.fire({
                  icon: "error",
                  title: "Failed",
                  text: data.message,
                });
              }
            } catch (error) {
              Swal.fire({
                icon: "error",
                title: "System Error",
                text: "Cannot connect to server.",
              });
            } finally {
              document.getElementById("loader").style.display = "none";
            }
          }
        });
      }

      // 🌟 រត់ពេលចូលទំព័រដំបូង
      window.onload = () => {
        fetchSettings(); // ទាញ Logo
        fetchOrders(true); // ទាញ Order (មានលោត Loading)

        // 🌟 រត់ Auto Refresh រៀងរាល់ ១០ វិនាទី (អត់លោត Loading រំខានភ្នែកទេ)
        setInterval(() => {
          fetchOrders(false);
        }, 10000); // 10000 ms = 10 វិនាទី
      };
    </script>
  </body>
</html>
